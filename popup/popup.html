<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="popup-header-left">
      <img src="../images/sidesy-128.png" alt="Sidesy" class="popup-logo">
      <h1 class="popup-title">Sidesy</h1>
    </div>
    <div class="popup-header-right">
      <span class="popup-version" id="popup-version"></span>
      <button id="popup-settings-btn" class="popup-icon-btn" type="button" aria-label="Open settings" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </header>
  <div class="popup-viewport">
    <div class="popup-track" id="popup-track">
      <section class="popup-page" id="popup-main-page" aria-label="Sidesy menu">
        <nav id="popup-menu"></nav>
      </section>
      <section class="popup-page popup-settings-page" id="popup-settings-page" aria-label="Sidesy settings">
        <button id="popup-back-btn" class="popup-back-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
          </svg>
          <span>Back</span>
        </button>
        <h2 class="popup-settings-title">Settings</h2>
        <label class="settings-row" for="collapse-default-toggle">
          <span class="settings-text">
            <span class="settings-label">Fold comments by default</span>
            <span class="settings-description">Start each video with comments folded into a slim bar. Applies to new videos.</span>
          </span>
          <span class="settings-switch">
            <input type="checkbox" id="collapse-default-toggle">
            <span class="settings-knob" aria-hidden="true"></span>
          </span>
        </label>
        <div class="settings-shortcuts">
          <span class="settings-shortcuts-title">Shortcuts</span>
          <ul>
            <li><span class="settings-key">Alt + Shift + S</span> toggle sidebar</li>
            <li><span class="settings-key">Z</span> toggle full height</li>
            <li><span class="settings-key">X</span> fold to a slim bar</li>
          </ul>
        </div>
      </section>
    </div>
  </div>
  <footer class="popup-footer">
    made with &hearts; by <a href="https://x.com/abin_john98" target="_blank" rel="noopener noreferrer">Abin John</a>
  </footer>
  <script src="../constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
