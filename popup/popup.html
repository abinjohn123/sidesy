<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="popup-header-left">
      <img src="../images/sidesy-128.png" alt="Sidesy" class="popup-logo">
      <h1 class="popup-title">Sidesy</h1>
    </div>
    <span class="popup-version" id="popup-version"></span>
  </header>
  <section class="popup-settings" aria-labelledby="preferences-heading">
    <h2 class="popup-section-label" id="preferences-heading">Preferences</h2>
    <div class="popup-setting">
      <span class="link-text">
        <span class="link-label" id="auto-scroll-label">Autoscroll</span>
        <span class="link-description" id="auto-scroll-description">When moving comments below video</span>
      </span>
      <label class="popup-switch">
        <input type="checkbox" role="switch" id="auto-scroll-comments" aria-labelledby="auto-scroll-label" aria-describedby="auto-scroll-description" checked disabled>
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </div>
    <p class="setting-error" id="setting-error" role="status" hidden></p>
  </section>
  <nav id="popup-menu" aria-label="Support and more from me"></nav>
  <footer class="popup-footer">
    made with &hearts; by <a href="https://x.com/abin_john98" target="_blank" rel="noopener noreferrer">Abin John</a>
  </footer>
  <script src="../constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
