name: Live YouTube E2E

on:
  schedule:
    # Daily at 09:47 IST (04:17 UTC), away from the top-of-hour rush.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Optional public YouTube watch URL with comments enabled'
        required: false
        type: string
  pull_request:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'background.js'
      - 'constants.js'
      - 'manifest.json'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/e2e-youtube.yml'

permissions:
  contents: read

concurrency:
  group: live-youtube-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_VIDEO_URL: ${{ inputs.video_url || 'https://www.youtube.com/watch?v=jNQXAC9IVRw&hl=en' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install native keyboard input support
        run: sudo apt-get install -y xdotool
      - name: Test the actual extension against live YouTube
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24' npm run test:e2e
      - name: Upload test report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-youtube-e2e-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
